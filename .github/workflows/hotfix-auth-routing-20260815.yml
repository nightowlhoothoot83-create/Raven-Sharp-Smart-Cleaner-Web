name: Hotfix Smart Cleaner auth routing
on:
  push:
    paths: ['.github/workflows/hotfix-auth-routing-20260815.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair API routing
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.html'); s=p.read_text()
          old='const API_BASE = (window.SMART_CLEANER_API_URL || "https://cleaner.raven-sharp.com") + "/api";'
          new='const API_BASE = (window.SMART_CLEANER_API_URL || "https://raven-sharp-smart-ai-cleaner-production.up.railway.app") + "/api";'
          if old not in s and new not in s: raise SystemExit('API_BASE marker missing')
          p.write_text(s.replace(old,new))
      - name: Verify
        run: grep -q 'raven-sharp-smart-ai-cleaner-production.up.railway.app' app.html
      - name: Commit
        run: |
          git config user.name 'Raven Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || (git commit -m 'Fix Smart Cleaner login routing to Railway backend' && git push)
