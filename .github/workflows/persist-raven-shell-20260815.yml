name: Persist Raven Sharp shell - Smart Cleaner
on:
  push:
    paths:
      - '.github/workflows/persist-raven-shell-20260815.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch app shell
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.html'); s=p.read_text()
          css='''\n/* Persistent approved Raven Sharp shell */\nnav.topbar{min-height:64px;padding:10px 24px;background:rgba(8,8,16,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:30}\nnav.topbar .brand{display:flex;align-items:center;gap:12px}nav.topbar .brand img{width:44px;height:44px;border-radius:0;object-fit:contain;filter:drop-shadow(0 0 8px rgba(124,92,191,.4))}\n.rs-brand-lock{font-family:'Cabinet Grotesk','Outfit',sans-serif;font-size:18px;font-weight:800;letter-spacing:-.025em;line-height:1}.rs-brand-lock strong{color:var(--purple-glow)}.rs-brand-lock small{display:block;margin-top:4px;font:500 9px/1 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#38bdf8}\n.rs-suite-link{margin-left:auto;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700}.rs-suite-link:hover{color:#fff}.rs-top-actions{display:flex;align-items:center;gap:14px}@media(max-width:560px){.rs-suite-link{display:none}}\n'''
          if 'Persistent approved Raven Sharp shell' not in s:
              s=s.replace('</style>',css+'</style>',1)
          old='<nav class="topbar">\n    <div class="brand"><img src="/brands/ravenSharpLogo.png" alt=""><span>Smart Cleaner</span></div>\n    <button class="ghost" onclick="logout()">Log Out</button>\n  </nav>'
          new='<nav class="topbar">\n    <div class="brand"><img src="/brands/ravenSharpLogo.png" alt="Raven Sharp"><div class="rs-brand-lock">RAVEN <strong>SHARP</strong><small>Smart Cleaner</small></div></div>\n    <div class="rs-top-actions"><a class="rs-suite-link" href="https://raven-sharp.com">Raven Sharp Suite</a><button class="ghost" onclick="logout()">Log Out</button></div>\n  </nav>'
          if old in s: s=s.replace(old,new,1)
          elif 'rs-brand-lock' not in s: raise SystemExit('Cleaner topbar marker missing')
          p.write_text(s)
      - name: Verify
        run: grep -q 'rs-brand-lock' app.html
      - name: Commit
        run: |
          git config user.name 'Raven Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || (git commit -m 'Keep Raven Sharp shell throughout Smart Cleaner app' && git push)
